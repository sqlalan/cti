spring.application.name=cti-api

# Neon PostgreSQL: defina DB_HOST (ex.: ep-xxxx.sa-east-1.aws.neon.tech), DB_NAME, DB_USER,
# DB_PASSWORD e DB_SSLMODE=require. Os valores padrao servem para um Postgres local.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cti}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Front-end que pode chamar a API (separe por virgula).
cti.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Upload da planilha: mesmo limite da tela de Upload (25 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Script de analise (CienciaD/main.py). Sem PYTHON_CMD usa "py" no Windows e "python3" no resto.
cti.python.comando=${PYTHON_CMD:}
cti.python.script=${PYTHON_SCRIPT:../CienciaD/main.py}
cti.python.timeout=${PYTHON_TIMEOUT:120s}

# Token do login (JWT HS256). Em producao defina JWT_SEGREDO com 32+ caracteres; sem ele a chave e
# aleatoria e os tokens deixam de valer a cada reinicio.
cti.jwt.segredo=${JWT_SEGREDO:}
cti.jwt.validade=${JWT_VALIDADE:8h}
