spring.application.name=cti-api

# PostgreSQL na nuvem (Azure ou Neon): defina DB_HOST (ex.: meuservidor.postgres.database.azure.com),
# DB_NAME, DB_USER, DB_PASSWORD e DB_SSLMODE=require. Os valores padrao servem para um Postgres local.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cti}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
# Mostra no terminal o SQL que o Hibernate executa (create table, insert, select).
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Front-end que pode chamar a API (separe por virgula).
# CORS_ORIGIN e o nome do guia da disciplina; CORS_ORIGENS continua valendo.
cti.cors.origens=${CORS_ORIGIN:${CORS_ORIGENS:http://localhost:5173}}

# Upload da planilha: mesmo limite da tela de Upload (25 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Script de analise (CienciaD/main.py). Sem PYTHON_CMD usa "py" no Windows e "python3" no resto.
cti.python.comando=${PYTHON_CMD:}
cti.python.script=${PYTHON_SCRIPT:../CienciaD/main.py}
cti.python.timeout=${PYTHON_TIMEOUT:120s}

# Token do login (JWT HS256). Em producao defina JWT_SECRET com 32+ caracteres; sem ele a chave e
# aleatoria e os tokens deixam de valer a cada reinicio.
# JWT_SECRET e o nome do guia da disciplina; JWT_SEGREDO continua valendo.
cti.jwt.segredo=${JWT_SECRET:${JWT_SEGREDO:}}
cti.jwt.validade=${JWT_VALIDADE:8h}

# Mensagens de validacao sempre em portugues: sem isto um servidor em ingles responde
# "must not be blank" (o idioma vinha do sistema ou do navegador de quem chama).
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
