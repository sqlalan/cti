<!doctype html>
<!--
  translate="no" + meta google notranslate: o sistema inteiro já está em
  português, e o tradutor do navegador, mandado traduzir para português,
  trocava texto curto como se fosse estrangeiro — título de card, nome de
  serviço ("Cloud"), sobrenome ("Lima", "Reis"). Não traduzia nada útil, só
  corrompia dado e interface. O atributo impede a tradução; a meta faz o
  Chrome nem oferecer.
-->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Synthetix conecta dados, análises e inteligência em uma única plataforma para ajudar empresas a decidirem com mais segurança."
    />
    <title>Synthetix — Dados que conectam. Inteligência que transforma.</title>
  </head>
  <body class="scheme-light-dark bg-white dark:bg-night-950">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
