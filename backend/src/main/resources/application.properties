spring.application.name=cti-api

# PostgreSQL na nuvem (Azure ou Neon). Duas formas:
# - DB_URL com o endereco JDBC completo, como no Azure App Service
#   (jdbc:postgresql://SERVIDOR.postgres.database.azure.com:5432/ctiinsights?sslmode=require);
# - ou DB_HOST, DB_PORT, DB_NAME e DB_SSLMODE=require separados.
# Sem nenhuma, usa um Postgres local.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cti}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
# Mostra no terminal o SQL que o Hibernate executa (create table, insert, select).
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Front-end que pode chamar a API (separe por virgula).
# CORS_ORIGINS e o nome usado no deploy; CORS_ORIGIN e CORS_ORIGENS continuam valendo.
cti.cors.origens=${CORS_ORIGINS:${CORS_ORIGIN:${CORS_ORIGENS:http://localhost:5173}}}

# API do Python (analytics-python/api.py), chamada pelo PythonEtlService depois que o lote e salvo.
# ETL_KEY e a mesma chave do ETL_API_KEY do analytics-python/.env (vazia nos dois = sem chave).
app.etl.url=${ETL_URL:http://localhost:8000/etl}
app.etl.key=${ETL_KEY:}

# Primeiro administrador (aprova as contas do cadastro publico). Com ADMIN_EMAIL de uma conta que ja
# existe, ela vira ADMIN e aprovada ao subir; sem a conta, ADMIN_PASSWORD (8+ caracteres) cria.
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_PASSWORD:}

# Token do login (JWT HS256). Em producao defina JWT_SECRET com 32+ caracteres; sem ele a chave e
# aleatoria e os tokens deixam de valer a cada reinicio.
# JWT_SECRET e o nome principal; JWT_SEGREDO continua valendo.
cti.jwt.segredo=${JWT_SECRET:${JWT_SEGREDO:}}
# Validade curta (120 min), para um token roubado valer pouco tempo.
cti.jwt.validade=${JWT_VALIDADE:2h}

# Forca bruta: depois de N senhas erradas seguidas para o mesmo e-mail, o login fica bloqueado por um tempo.
cti.login.tentativas=${LOGIN_TENTATIVAS:5}
cti.login.bloqueio=${LOGIN_BLOQUEIO:15m}

# Mensagens de validacao sempre em portugues: sem isto um servidor em ingles responde
# "must not be blank" (o idioma vinha do sistema ou do navegador de quem chama).
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
